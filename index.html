<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>この絵の、その先へ。</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#222}
#shade{position:fixed;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65));pointer-events:none}
#hint{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:10px 16px;border:1px solid rgba(255,255,255,.55);border-radius:999px;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);font-size:13px;white-space:nowrap}
#scan{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(72vw,300px);height:min(72vw,300px);border:1.5px solid rgba(255,255,255,.8);border-radius:24px;pointer-events:none}
#scan:before,#scan:after{content:"";position:absolute;width:34px;height:34px;border-color:#fff;border-style:solid}
#scan:before{left:-2px;top:-2px;border-width:3px 0 0 3px;border-radius:20px 0 0 0}
#scan:after{right:-2px;bottom:-2px;border-width:0 3px 3px 0;border-radius:0 0 20px 0}
#start{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);border:0;border-radius:999px;padding:15px 26px;background:#fff;color:#111;font-size:16px;font-weight:700;box-shadow:0 8px 30px #0008}
#story{position:fixed;left:16px;right:16px;bottom:20px;background:rgba(255,255,255,.95);border-radius:22px;padding:20px;display:none;box-shadow:0 15px 50px #0009}
.kicker{font-size:12px;letter-spacing:.12em;opacity:.55}
h1{font-size:25px;line-height:1.25;margin:7px 0 10px}
p{margin:7px 0;line-height:1.65;font-size:14px}
button.more{margin-top:12px;border:0;background:#111;color:#fff;border-radius:999px;padding:11px 18px}
#story .visual{height:150px;border-radius:15px;background:
radial-gradient(circle at 30% 30%,#fff 0 5%,transparent 6%),
linear-gradient(135deg,#ddd,#888 48%,#eee 49%,#bbb);
display:flex;align-items:end;padding:14px;color:#111;font-size:12px;font-weight:700}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<div id="shade"></div>
<div id="hint">商品にスマホを向けてください</div>
<div id="scan"></div>

<button id="start">AR体験をはじめる</button>

<section id="story">
  <div class="visual">制作風景（サンプル）</div>
  <div class="kicker">THE STORY OF THIS ART</div>
  <h1>この絵、どこから来たんだろう？</h1>
  <p><b>この作品を描いたのは、○○さん。</b></p>
  <p>ここからは、実際にこの絵が生まれた時間へ。ペンの音、紙の感触、描いている手元を見てください。</p>
  <button class="more" onclick="showSecond()">制作の時間を見る →</button>
</section>

<script>
const video=document.querySelector('#camera');
const start=document.querySelector('#start');
const story=document.querySelector('#story');
const hint=document.querySelector('#hint');
const scan=document.querySelector('#scan');

start.onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject=stream;
    start.style.display='none';
    hint.textContent='商品を認識した想定のサンプル';
    scan.style.borderColor='rgba(255,255,255,.35)';
    setTimeout(()=>{
      scan.style.display='none';
      story.style.display='block';
    },1400);
  }catch(e){
    alert('カメラを使うにはHTTPS環境とカメラ許可が必要です。');
  }
};

function showSecond(){
  story.innerHTML=`
    <div class="kicker">BEHIND THE ART</div>
    <h1>描いている、その時間。</h1>
    <p>ここに5〜15秒ほどの実写動画を入れる。</p>
    <p>手元、紙、ペンの音、施設の空気。きれいに作りすぎず、「そこにいる感じ」を残す。</p>
    <button class="more" onclick="showThird()">この作品が商品になるまで →</button>`;
}
function showThird(){
  story.innerHTML=`
    <div class="kicker">FROM ART TO PRODUCT</div>
    <h1>そして、この絵が商品になりました。</h1>
    <p>原画を学生がデザインし、ハンドタオルやチャームへ。</p>
    <p><b>目の前の商品は、ここから始まりました。</b></p>
    <button class="more" onclick="location.reload()">もう一つの作品を見る</button>`;
}
</script>
</body>
</html>
