<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>AR Artist</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }

      /* START SCREEN */
      #start {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #111;
      }

      #start p {
        color: white;
        font-size: 15px;
        margin-bottom: 20px;
      }

      #start button {
        padding: 18px 32px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        background: white;
        color: black;
        cursor: pointer;
      }

      #start button:disabled {
        opacity: 0.6;
      }

      /* CAMERA MESSAGE */
      #message {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 500;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 14px;
        display: none;
        white-space: nowrap;
      }

      /* CAPTION */
      #caption {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        z-index: 600;
        max-width: 86%;
        color: white;
        background: rgba(0, 0, 0, 0.55);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
        display: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      #caption.show {
        display: block;
        opacity: 1;
      }

      /* UNMUTE */
      #unmute {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 600;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.9);
        font-size: 22px;
        display: none;
      }

      /* PAUSE BEAT */
      #pause-beat {
        position: fixed;
        inset: 0;
        z-index: 700;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }

      #pause-beat.show {
        opacity: 1;
        pointer-events: auto;
      }

      /* CTA */
      #cta {
        position: fixed;
        inset: 0;
        z-index: 800;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.92);
        color: white;
        text-align: center;
        padding: 0 24px;
      }

      #cta.show {
        display: flex;
      }

      #cta p {
        font-size: 17px;
        line-height: 1.8;
        margin-bottom: 28px;
      }

      #cta a {
        display: inline-block;
        padding: 14px 28px;
        background: white;
        color: black;
        border-radius: 10px;
        text-decoration: none;
        font-size: 15px;
        margin-bottom: 14px;
      }

      #cta button {
        background: none;
        border: none;
        color: #aaa;
        font-size: 13px;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <!-- START SCREEN -->
    <div id="start">
      <p>カメラを使って作品を体験します</p>
      <button id="startButton">AR体験をはじめる</button>
    </div>

    <!-- UI ELEMENTS -->
    <div id="message">イラストにカメラを向けてください</div>
    <div id="caption"></div>
    <button id="unmute">🔊</button>
    <div id="pause-beat"></div>

    <!-- CTA SCREEN -->
    <div id="cta">
      <p id="cta-text"></p>
      <a id="cta-link" href="#" target="_blank">グッズを見る</a>
      <button id="cta-close">閉じてもう一度体験する</button>
    </div>

    <!-- MINDAR SCENE -->
    <a-scene
      id="scene"
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        maxTrack: 1;
        uiScanning: no;
        uiLoading: no;
      "
      color-space="sRGB"
      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
      "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="artist01"
          src="./artist01.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>

        <video
          id="artist02"
          src="./artist02.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 01 -->
      <a-entity id="target01" mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane01"
          src="#artist01"
          position="0 0 0"
          width="1"
          height="0.5625"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>

      <!-- TARGET 02 -->
      <a-entity id="target02" mindar-image-target="targetIndex: 1">
        <a-video
          id="videoPlane02"
          src="#artist02"
          position="0 0 0"
          width="1"
          height="0.5625"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const CONFIG = {
        artist01: {
          unmuteAt: 4,
          captions: [
            { start: 0, end: 4, text: "" },
            {
              start: 4,
              end: 9,
              text: "これ描いてるとき、なんも考えてない。落ち着くから。",
            },
            {
              start: 9,
              end: 14,
              text: "好きな色から、順番に塗っていくの。",
            },
          ],
          ctaDelay: 2.5,
          ctaText: "ありがとう、を、届けてください。",
          ctaUrl: "#",
        },
        artist02: {
          unmuteAt: 4,
          captions: [
            { start: 0, end: 4, text: "" },
            { start: 4, end: 10, text: "" },
          ],
          ctaDelay: 2.5,
          ctaText: "ありがとう、を、届けてください。",
          ctaUrl: "#",
        },
      };

      const FADE_DUR = 400; // ms

      const scene = document.getElementById("scene");
      const start = document.getElementById("start");
      const startButton = document.getElementById("startButton");
      const message = document.getElementById("message");
      const target01 = document.getElementById("target01");
      const target02 = document.getElementById("target02");
      const video01 = document.getElementById("artist01");
      const video02 = document.getElementById("artist02");
      const plane01 = document.getElementById("videoPlane01");
      const plane02 = document.getElementById("videoPlane02");
      const caption = document.getElementById("caption");
      const unmuteBtn = document.getElementById("unmute");
      const pauseBeat = document.getElementById("pause-beat");
      const cta = document.getElementById("cta");
      const ctaText = document.getElementById("cta-text");
      const ctaLink = document.getElementById("cta-link");
      const ctaClose = document.getElementById("cta-close");

      let currentKey = null;
      let unmuteShown = {
        artist01: false,
        artist02: false,
      };

      // ===== fadeIn/fadeOut(タイマー競合対策版) =====
      const fadeTimers = new Map(); // plane要素 → 非表示予約タイマーID

      function clearFadeTimer(plane) {
        const t = fadeTimers.get(plane);
        if (t) {
          clearTimeout(t);
          fadeTimers.delete(plane);
        }
      }

      function fadeInPlane(plane) {
        clearFadeTimer(plane); // 予約されていた非表示タイマーを破棄

        plane.removeAttribute("animation__fadeout");
        plane.setAttribute("visible", true);
        plane.setAttribute("animation__fadein", {
          property: "material.opacity",
          from: 0,
          to: 1,
          dur: FADE_DUR,
          easing: "easeInOutQuad",
        });
      }

      function fadeOutPlane(plane) {
        clearFadeTimer(plane); // 直前の非表示タイマーが残っていれば破棄

        plane.removeAttribute("animation__fadein");
        plane.setAttribute("animation__fadeout", {
          property: "material.opacity",
          from: 1,
          to: 0,
          dur: FADE_DUR,
          easing: "easeInOutQuad",
        });

        const timerId = setTimeout(() => {
          plane.setAttribute("visible", false);
          fadeTimers.delete(plane);
        }, FADE_DUR);

        fadeTimers.set(plane, timerId);
      }

      // ===== play/pause競合対策 =====
      const playPromises = new Map(); // video要素 → 進行中のplay() Promise

      function safePlay(video) {
        const p = video.play();
        if (p !== undefined) {
          playPromises.set(video, p);
          p.catch((e) => console.log("play error:", e)).finally(() => {
            playPromises.delete(video);
          });
        }
      }

      async function safePause(video) {
        const pending = playPromises.get(video);
        if (pending) {
          try {
            await pending;
          } catch (e) {
            /* noop */
          }
        }
        video.pause();
      }

      // ===== AR開始(ボタン押下時に手動start) =====
      startButton.addEventListener("click", async () => {
        startButton.disabled = true;
        startButton.textContent = "カメラを起動しています…";

        try {
          const arSystem = scene.systems["mindar-image-system"];

          if (!arSystem) {
            throw new Error("MindAR systemが見つかりません");
          }

          await arSystem.start();

          video01.load();
          video02.load();

          start.style.display = "none";
          message.style.display = "block";
        } catch (error) {
          console.error("AR START ERROR:", error);

          startButton.disabled = false;
          startButton.textContent = "AR体験をはじめる";

          alert(
            "カメラを起動できませんでした。\n" +
              "ブラウザのカメラ使用許可を確認してください。",
          );
        }
      });

      // ===== 字幕制御 =====
      function bindCaptions(video, key) {
        video.addEventListener("timeupdate", () => {
          const conf = CONFIG[key];
          const t = video.currentTime;
          const hit = conf.captions.find((c) => t >= c.start && t < c.end);

          if (hit && hit.text) {
            if (caption.textContent !== hit.text) {
              caption.textContent = hit.text;
            }
            caption.classList.add("show");
          } else {
            caption.classList.remove("show");
          }

          if (!unmuteShown[key] && t >= conf.unmuteAt) {
            unmuteShown[key] = true;
            unmuteBtn.style.display = "block";
          }
        });
      }

      bindCaptions(video01, "artist01");
      bindCaptions(video02, "artist02");

      // ===== ミュート解除ボタン =====
      unmuteBtn.addEventListener("click", () => {
        if (currentKey) {
          const v = currentKey === "artist01" ? video01 : video02;
          v.muted = false;
        }
        unmuteBtn.style.display = "none";
      });

      // ===== 動画再生終了時 =====
      function bindEnded(video, key) {
        video.addEventListener("ended", () => {
          const conf = CONFIG[key];
          caption.classList.remove("show");
          unmuteBtn.style.display = "none";
          pauseBeat.classList.add("show");

          setTimeout(() => {
            ctaText.textContent = conf.ctaText;
            ctaLink.href = conf.ctaUrl;
            cta.classList.add("show");
          }, conf.ctaDelay * 1000);
        });
      }

      bindEnded(video01, "artist01");
      bindEnded(video02, "artist02");

      // ===== CTA閉じるボタン =====
      ctaClose.addEventListener("click", () => {
        cta.classList.remove("show");
        pauseBeat.classList.remove("show");

        fadeOutPlane(plane01);
        fadeOutPlane(plane02);

        message.style.display = "block";
        message.textContent = "イラストにカメラを向けてください";
      });

      // ===== TARGET 01 =====
      target01.addEventListener("targetFound", () => {
        console.log("TARGET 01 FOUND");
        currentKey = "artist01";
        message.style.display = "none";

        safePause(video02);
        fadeOutPlane(plane02);

        video01.currentTime = 0;
        fadeInPlane(plane01);
        safePlay(video01);
      });

      target01.addEventListener("targetLost", () => {
        console.log("TARGET 01 LOST");
        fadeOutPlane(plane01);
        safePause(video01);
        caption.classList.remove("show");
        unmuteBtn.style.display = "none";

        if (!cta.classList.contains("show")) {
          message.style.display = "block";
          message.textContent = "イラストにカメラを向けてください";
        }
      });

      // ===== TARGET 02 =====
      target02.addEventListener("targetFound", () => {
        console.log("TARGET 02 FOUND");
        currentKey = "artist02";
        message.style.display = "none";

        safePause(video01);
        fadeOutPlane(plane01);

        video02.currentTime = 0;
        fadeInPlane(plane02);
        safePlay(video02);
      });

      target02.addEventListener("targetLost", () => {
        console.log("TARGET 02 LOST");
        fadeOutPlane(plane02);
        safePause(video02);
        caption.classList.remove("show");
        unmuteBtn.style.display = "none";

        if (!cta.classList.contains("show")) {
          message.style.display = "block";
          message.textContent = "イラストにカメラを向けてください";
        }
      });

      // ===== 画面復帰時の強制リセット(WebGLコンテキスト破棄対策) =====
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          console.log("PAGE RESUMED — resetting AR video state");

          safePause(video01);
          safePause(video02);

          clearFadeTimer(plane01);
          clearFadeTimer(plane02);
          plane01.removeAttribute("animation__fadein");
          plane01.removeAttribute("animation__fadeout");
          plane02.removeAttribute("animation__fadein");
          plane02.removeAttribute("animation__fadeout");
          plane01.setAttribute("visible", false);
          plane02.setAttribute("visible", false);
          plane01.setAttribute("material", "opacity", 0);
          plane02.setAttribute("material", "opacity", 0);

          video01.load();
          video02.load();

          caption.classList.remove("show");
          unmuteBtn.style.display = "none";

          currentKey = null;

          if (!cta.classList.contains("show")) {
            message.style.display = "block";
            message.textContent = "イラストにカメラを向けてください";
          }
        }
      });
    </script>
  </body>
</html>
