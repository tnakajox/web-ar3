<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>AR Artist</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }

      /* START SCREEN */
      #start {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #111;
      }

      #start p {
        color: white;
        font-size: 15px;
        margin-bottom: 20px;
      }

      #start button {
        padding: 18px 32px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        background: white;
        color: black;
        cursor: pointer;
      }

      #start button:disabled {
        opacity: 0.6;
      }

      /* CAMERA MESSAGE */
      #message {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 500;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 14px;
        display: none;
        white-space: nowrap;
      }

      /* CAPTION */
      #caption {
        position: fixed;
        left: 50%;
        bottom: 145px;
        transform: translateX(-50%);
        z-index: 600;
        max-width: 86%;
        color: white;
        background: rgba(0, 0, 0, 0.55);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
        display: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      #caption.show {
        display: block;
        opacity: 1;
      }

      /* MESSAGE */
      #thanks {
        position: fixed;
        left: 50%;
        bottom: 95px;
        transform: translateX(-50%);
        z-index: 650;
        color: white;
        font-size: 17px;
        line-height: 1.6;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        display: none;
        transition: opacity 0.8s ease;
        text-shadow:
          0 1px 4px rgba(0, 0, 0, 0.9),
          0 0 8px rgba(0, 0, 0, 0.7);
      }

      #thanks.show {
        display: block;
        opacity: 1;
      }

      /* VIDEO CONTROLLER */
      #controls {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 700;
        width: 88%;
        max-width: 500px;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 12px;
      }

      #playPause {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        color: black;
        font-size: 17px;
        cursor: pointer;
      }

      #timeline {
        flex: 1;
        min-width: 0;
        height: 4px;
        accent-color: white;
        cursor: pointer;
      }

      /* MINDAR SCENE */
      a-scene {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>

  <body>
    <!-- START SCREEN -->
    <div id="start">
      <p>カメラを使って作品を体験します</p>
      <button id="startButton">AR体験をはじめる</button>
    </div>

    <!-- UI ELEMENTS -->
    <div id="message">イラストにカメラを向けてください</div>

    <div id="caption"></div>

    <div id="thanks">誰かに、届きますように</div>

    <!-- VIDEO CONTROLLER -->
    <div id="controls">
      <button id="playPause" type="button">Ⅱ</button>
      <input
        id="timeline"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
      />
    </div>

    <!-- MINDAR SCENE -->
    <a-scene
      id="scene"
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        maxTrack: 1;
        uiScanning: no;
        uiLoading: no;
      "
      color-space="sRGB"
      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
      "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="artist01"
          src="./artist01.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>

        <video
          id="artist02"
          src="./artist02.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 01 -->
      <a-entity id="target01" mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane01"
          src="#artist01"
          position="0 0 0"
          width="1"
          height="0.5625"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>

      <!-- TARGET 02 -->
      <a-entity id="target02" mindar-image-target="targetIndex: 1">
        <a-video
          id="videoPlane02"
          src="#artist02"
          position="0 0 0"
          width="1"
          height="0.5625"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const CONFIG = {
        artist01: {
          captions: [
            { start: 0, end: 4, text: "" },
            {
              start: 4,
              end: 9,
              text: "これ描いてるとき、なんも考えてない。落ち着くから。",
            },
            {
              start: 9,
              end: 14,
              text: "好きな色から、順番に塗っていくの。",
            },
          ],
          messageDelay: 2.5,
          messageText: "誰かに、届きますように",
        },

        artist02: {
          captions: [
            { start: 0, end: 4, text: "" },
            { start: 4, end: 10, text: "" },
          ],
          messageDelay: 2.5,
          messageText: "誰かに、届きますように",
        },
      };

      const FADE_DUR = 400;

      const scene = document.getElementById("scene");
      const start = document.getElementById("start");
      const startButton = document.getElementById("startButton");
      const message = document.getElementById("message");

      const target01 = document.getElementById("target01");
      const target02 = document.getElementById("target02");

      const video01 = document.getElementById("artist01");
      const video02 = document.getElementById("artist02");

      const plane01 = document.getElementById("videoPlane01");
      const plane02 = document.getElementById("videoPlane02");

      const caption = document.getElementById("caption");

      const thanks = document.getElementById("thanks");

      const controls = document.getElementById("controls");
      const playPause = document.getElementById("playPause");
      const timeline = document.getElementById("timeline");

      let currentKey = null;

      let messageTimer = null;

      let isSeeking = false;

      /* ===== fadeIn / fadeOut ===== */

      const fadeTimers = new Map();

      function clearFadeTimer(plane) {
        const t = fadeTimers.get(plane);

        if (t) {
          clearTimeout(t);
          fadeTimers.delete(plane);
        }
      }

      function fadeInPlane(plane) {
        clearFadeTimer(plane);

        plane.removeAttribute("animation__fadeout");

        plane.setAttribute("visible", true);

        plane.setAttribute("animation__fadein", {
          property: "material.opacity",
          from: 0,
          to: 1,
          dur: FADE_DUR,
          easing: "easeInOutQuad",
        });
      }

      function fadeOutPlane(plane) {
        clearFadeTimer(plane);

        plane.removeAttribute("animation__fadein");

        plane.setAttribute("animation__fadeout", {
          property: "material.opacity",
          from: 1,
          to: 0,
          dur: FADE_DUR,
          easing: "easeInOutQuad",
        });

        const timerId = setTimeout(() => {
          plane.setAttribute("visible", false);
          fadeTimers.delete(plane);
        }, FADE_DUR);

        fadeTimers.set(plane, timerId);
      }

      /* ===== play / pause競合対策 ===== */

      const playPromises = new Map();

      function safePlay(video) {
        const p = video.play();

        if (p !== undefined) {
          playPromises.set(video, p);

          p.catch((e) => {
            console.log("play error:", e);
          }).finally(() => {
            playPromises.delete(video);
          });
        }
      }

      async function safePause(video) {
        const pending = playPromises.get(video);

        if (pending) {
          try {
            await pending;
          } catch (e) {
            /* noop */
          }
        }

        video.pause();
      }

      /* ===== AR開始 ===== */

      startButton.addEventListener("click", async () => {
        startButton.disabled = true;
        startButton.textContent = "カメラを起動しています…";

        try {
          const arSystem = scene.systems["mindar-image-system"];

          if (!arSystem) {
            throw new Error("MindAR systemが見つかりません");
          }

          await arSystem.start();

          video01.load();
          video02.load();

          start.style.display = "none";
          message.textContent = "イラストにカメラを向けると、物語が始まります";
          message.style.display = "block";
        } catch (error) {
          console.error("AR START ERROR:", error);

          startButton.disabled = false;
          startButton.textContent = "カメラを起動";

          alert(
            "カメラを起動できませんでした。\n" +
              "ブラウザのカメラ使用許可を確認してください。",
          );
        }
      });

      /* ===== メッセージ ===== */

      let typewriterTimer = null; // ★追加:1文字ずつ表示するタイマー

      function showThanksTypewriter(key) {
        const conf = CONFIG[key];

        clearTimeout(messageTimer);
        clearInterval(typewriterTimer); // ★追加:前回のタイプライターが残ってたら止める

        thanks.classList.remove("show");
        thanks.textContent = "";

        messageTimer = setTimeout(() => {
          thanks.classList.add("show");

          const text = conf.messageText;
          let i = 0;

          typewriterTimer = setInterval(() => {
            thanks.textContent += text[i];
            i++;

            if (i >= text.length) {
              clearInterval(typewriterTimer);
            }
          }, 80); // 1文字あたり80ms
        }, conf.messageDelay * 1000);
      }

      function hideThanks() {
        clearTimeout(messageTimer);
        thanks.classList.remove("show");
      }

      /* ===== 字幕 ===== */

      function bindCaptions(video, key) {
        video.addEventListener("timeupdate", () => {
          if (currentKey !== key) {
            return;
          }

          const conf = CONFIG[key];
          const t = video.currentTime;

          const hit = conf.captions.find((c) => t >= c.start && t < c.end);

          if (hit && hit.text) {
            if (caption.textContent !== hit.text) {
              caption.textContent = hit.text;
            }

            caption.classList.add("show");
          } else {
            caption.classList.remove("show");
          }

          /* タイムライン更新 */

          if (!isSeeking && video.duration) {
            timeline.value = (video.currentTime / video.duration) * 100;
          }
        });
      }

      bindCaptions(video01, "artist01");
      bindCaptions(video02, "artist02");

      /* ===== 動画の長さ取得 ===== */

      function bindMetadata(video) {
        video.addEventListener("loadedmetadata", () => {
          if (currentKey === "artist01" && video === video01) {
            timeline.value = 0;
          }

          if (currentKey === "artist02" && video === video02) {
            timeline.value = 0;
          }
        });
      }

      bindMetadata(video01);
      bindMetadata(video02);

      /* ===== 再生 / 一時停止 ===== */

      playPause.addEventListener("click", () => {
        if (!currentKey) {
          return;
        }

        const video = currentKey === "artist01" ? video01 : video02;

        if (video.paused) {
          safePlay(video);
          playPause.textContent = "Ⅱ";
        } else {
          safePause(video);
          playPause.textContent = "▶";
        }
      });

      /* ===== タイムライン ===== */

      timeline.addEventListener("pointerdown", () => {
        isSeeking = true;
      });

      timeline.addEventListener("input", () => {
        if (!currentKey) {
          return;
        }

        const video = currentKey === "artist01" ? video01 : video02;

        if (!video.duration) {
          return;
        }

        const ratio = Number(timeline.value) / 100;

        video.currentTime = video.duration * ratio;
      });

      timeline.addEventListener("pointerup", () => {
        isSeeking = false;
      });

      timeline.addEventListener("change", () => {
        isSeeking = false;
      });

      /* ===== TARGET 01 ===== */

      target01.addEventListener("targetFound", () => {
        console.log("TARGET 01 FOUND");

        currentKey = "artist01";

        message.style.display = "none";

        safePause(video02);
        fadeOutPlane(plane02);

        video01.currentTime = 0;

        timeline.value = 0;

        playPause.textContent = "Ⅱ";

        fadeInPlane(plane01);

        safePlay(video01);

        controls.style.display = "flex";

        showThanksTypewriter("artist01");
      });

      target01.addEventListener("targetLost", () => {
        console.log("TARGET 01 LOST");

        fadeOutPlane(plane01);

        safePause(video01);

        caption.classList.remove("show");

        hideThanks();

        controls.style.display = "none";

        playPause.textContent = "▶";

        if (currentKey === "artist01") {
          message.style.display = "block";
          message.textContent = "イラストにカメラを向けてください";
        }
      });

      /* ===== TARGET 02 ===== */

      target02.addEventListener("targetFound", () => {
        console.log("TARGET 02 FOUND");

        currentKey = "artist02";

        message.style.display = "none";

        safePause(video01);
        fadeOutPlane(plane01);

        video02.currentTime = 0;

        timeline.value = 0;

        playPause.textContent = "Ⅱ";

        fadeInPlane(plane02);

        safePlay(video02);

        controls.style.display = "flex";

        showThanksTypewriter("artist02");
      });

      target02.addEventListener("targetLost", () => {
        console.log("TARGET 02 LOST");

        fadeOutPlane(plane02);

        safePause(video02);

        caption.classList.remove("show");

        hideThanks();

        controls.style.display = "none";

        playPause.textContent = "▶";

        if (currentKey === "artist02") {
          message.style.display = "block";
          message.textContent = "イラストにカメラを向けてください";
        }
      });

      /* ===== 動画終了 ===== */

      function bindEnded(video, key) {
        video.addEventListener("ended", () => {
          if (currentKey !== key) {
            return;
          }

          /*
           * 最後まで見なくてもいい。
           * 終了してもメッセージとコントローラは残す。
           */

          playPause.textContent = "▶";

          caption.classList.remove("show");

          timeline.value = 100;
        });
      }

      bindEnded(video01, "artist01");
      bindEnded(video02, "artist02");

      /* ===== 画面復帰時のリセット ===== */

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          console.log("PAGE RESUMED — resetting AR video state");

          safePause(video01);
          safePause(video02);

          clearFadeTimer(plane01);
          clearFadeTimer(plane02);

          plane01.removeAttribute("animation__fadein");
          plane01.removeAttribute("animation__fadeout");

          plane02.removeAttribute("animation__fadein");
          plane02.removeAttribute("animation__fadeout");

          plane01.setAttribute("visible", false);
          plane02.setAttribute("visible", false);

          plane01.setAttribute("material", "opacity", 0);
          plane02.setAttribute("material", "opacity", 0);

          video01.load();
          video02.load();

          caption.classList.remove("show");

          hideThanks();

          controls.style.display = "none";

          playPause.textContent = "▶";

          timeline.value = 0;

          currentKey = null;

          message.style.display = "block";
          message.textContent = "イラストにカメラを向けてください";
        }
      });
    </script>
  </body>
</html>
