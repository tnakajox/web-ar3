<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AR Artist</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    #start button {
      padding: 18px 32px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
    }

    #message {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="start">
    <button id="startButton">AR体験をはじめる</button>
  </div>

  <div id="message">
    イラストにカメラを向けてください
  </div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
      uiScanning: no;
      uiLoading: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="artist01"
        src="./artist01.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

      <video
        id="artist02"
        src="./artist02.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- TARGET 01 -->

    <a-entity
      id="target01"
      mindar-image-target="targetIndex: 0">

      <a-video
        id="videoPlane01"
        src="#artist01"
        position="0 0 0"
        width="1"
        height="0.5625"
        material="opacity: 0"
        visible="false">
      </a-video>

    </a-entity>


    <!-- TARGET 02 -->

    <a-entity
      id="target02"
      mindar-image-target="targetIndex: 1">

      <a-video
        id="videoPlane02"
        src="#artist02"
        position="0 0 0"
        width="1"
        height="0.5625"
        material="opacity: 0"
        visible="false">
      </a-video>

    </a-entity>

  </a-scene>


  <script>

    const startScreen = document.getElementById("start");
    const startButton = document.getElementById("startButton");
    const message = document.getElementById("message");

    const target01 = document.getElementById("target01");
    const target02 = document.getElementById("target02");

    const video01 = document.getElementById("artist01");
    const video02 = document.getElementById("artist02");

    const plane01 = document.getElementById("videoPlane01");
    const plane02 = document.getElementById("videoPlane02");

    const sceneEl = document.getElementById("scene");


    /*
     * フェードイン
     */

    function fadeIn(plane) {

      plane.setAttribute("visible", true);

      let opacity = 0;

      const timer = setInterval(() => {

        opacity += 0.08;

        if (opacity >= 1) {
          opacity = 1;
          clearInterval(timer);
        }

        plane.setAttribute(
          "material",
          "opacity",
          opacity
        );

      }, 30);
    }


    /*
     * フェードアウト
     */

    function fadeOut(plane) {

      let opacity = 1;

      const timer = setInterval(() => {

        opacity -= 0.1;

        if (opacity <= 0) {

          opacity = 0;

          clearInterval(timer);

          plane.setAttribute("visible", false);
        }

        plane.setAttribute(
          "material",
          "opacity",
          opacity
        );

      }, 30);
    }


    /*
     * AR開始
     */

    startButton.addEventListener("click", async () => {

      startScreen.style.display = "none";

      message.style.display = "block";

      try {

        await video01.play();
        video01.pause();

        await video02.play();
        video02.pause();

      } catch (e) {

        console.log("Video preload:", e);

      }

      const arSystem =
        sceneEl.systems["mindar-image-system"];

      if (arSystem) {
        arSystem.start();
      }

    });


    /*
     * TARGET 01
     */

    target01.addEventListener("targetFound", () => {

      console.log("TARGET 01 FOUND");

      message.style.display = "none";

      plane02.setAttribute("visible", false);
      video02.pause();

      video01.currentTime = 0;

      fadeIn(plane01);

      video01.play().catch(err => {
        console.log(err);
      });

    });


    target01.addEventListener("targetLost", () => {

      console.log("TARGET 01 LOST");

      fadeOut(plane01);

      video01.pause();

    });


    /*
     * TARGET 02
     */

    target02.addEventListener("targetFound", () => {

      console.log("TARGET 02 FOUND");

      message.style.display = "none";

      plane01.setAttribute("visible", false);
      video01.pause();

      video02.currentTime = 0;

      fadeIn(plane02);

      video02.play().catch(err => {
        console.log(err);
      });

    });


    target02.addEventListener("targetLost", () => {

      console.log("TARGET 02 LOST");

      fadeOut(plane02);

      video02.pause();

    });

  </script>

</body>
</html>
