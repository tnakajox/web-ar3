<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>AR Artist</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- ★ 安全なダスト（微粒子）プログラム -->
    <script>
      AFRAME.registerComponent("safe-dust", {
        schema: {
          count: { type: "int", default: 30 },
          color: { type: "color", default: "#FFDD88" },
        },
        init: function () {
          for (let i = 0; i < this.data.count; i++) {
            const particle = document.createElement("a-circle");
            const x = (Math.random() - 0.5) * 1.5;
            const y = (Math.random() - 0.5) * 1.5;
            const z = Math.random() * 0.3 + 0.05;
            const radius = Math.random() * 0.012 + 0.003;

            particle.setAttribute("position", `${x} ${y} ${z}`);
            particle.setAttribute("radius", radius);
            particle.setAttribute("color", this.data.color);
            particle.setAttribute(
              "material",
              "transparent: true; opacity: 0; shader: flat",
            );

            const dur = 3000 + Math.random() * 4000;
            const targetY = y + (Math.random() * 0.3 + 0.1);

            particle.setAttribute(
              "animation__move",
              `property: position; to: ${x} ${targetY} ${z}; dur: ${dur}; loop: true; dir: alternate; easing: easeInOutSine`,
            );
            particle.setAttribute(
              "animation__fade",
              `property: material.opacity; from: 0; to: ${Math.random() * 0.6 + 0.2}; dur: ${dur / 2}; loop: true; dir: alternate; easing: easeInOutSine`,
            );
            this.el.appendChild(particle);
          }
        },
      });
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }

      #start {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #111;
      }
      #start p {
        color: white;
        font-size: 15px;
        margin-bottom: 20px;
      }
      #start button {
        padding: 18px 32px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        background: white;
        color: black;
        cursor: pointer;
      }
      #start button:disabled {
        opacity: 0.6;
      }

      /* ★ 追加: リンクボタン */
      #yokohama-link {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.95);
        color: #111;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        display: none;
        transition: transform 0.2s ease;
      }
      #yokohama-link:active {
        transform: scale(0.95);
      }

      #message {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 500;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 14px;
        display: none;
        white-space: nowrap;
      }

      #caption {
        position: fixed;
        left: 50%;
        bottom: 145px;
        transform: translateX(-50%);
        z-index: 600;
        max-width: 86%;
        color: white;
        background: rgba(0, 0, 0, 0.55);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
        display: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #caption.show {
        display: block;
        opacity: 1;
      }

      #thanks {
        position: fixed;
        left: 50%;
        bottom: 95px;
        transform: translateX(-50%);
        z-index: 650;
        color: white;
        font-size: 17px;
        line-height: 1.6;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        display: none;
        transition: opacity 0.8s ease;
        text-shadow:
          0 1px 4px rgba(0, 0, 0, 0.9),
          0 0 8px rgba(0, 0, 0, 0.7);
      }
      #thanks.show {
        display: block;
        opacity: 1;
      }

      #controls {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 700;
        width: 88%;
        max-width: 500px;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 12px;
      }
      #playPause {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        color: black;
        font-size: 17px;
        cursor: pointer;
      }
      #timeline {
        flex: 1;
        min-width: 0;
        height: 4px;
        accent-color: white;
        cursor: pointer;
      }

      a-scene {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>

  <body>
    <div id="start">
      <p>カメラを使って作品を体験します</p>
      <button id="startButton">カメラを起動する</button>
    </div>

    <!-- ★ 追加: グローバルリンクボタン -->
    <a id="yokohama-link" href="https://yokohamafont.jp/" target="_blank"
      >YOKOHAMA FONT</a
    >

    <div id="message">イラストにカメラを向けてください</div>
    <div id="caption"></div>
    <div id="thanks">誰かに、届きますように</div>

    <div id="controls">
      <button id="playPause" type="button">Ⅱ</button>
      <input
        id="timeline"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
      />
    </div>

    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiScanning: no; uiLoading: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="artist01"
          src="./artist01.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>
        <video
          id="artist02"
          src="./artist02.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>
        <video
          id="artist03"
          src="./artist03.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>
        <video
          id="artist04"
          src="./artist04.mp4"
          preload="auto"
          muted
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 01 (横動画) -->
      <a-entity id="target01" mindar-image-target="targetIndex: 0">
        <a-entity
          safe-dust="count: 35; color: #FFF0C0;"
          scale="1.4 1.4 1.4"
          position="0 0 0.05"
        ></a-entity>
        <a-video
          id="videoPlane01"
          src="#artist01"
          position="0 0 0.1"
          width="1.4"
          height="0.7875"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>

      <!-- TARGET 02 (縦動画に変更) -->
      <a-entity id="target02" mindar-image-target="targetIndex: 1">
        <a-entity
          safe-dust="count: 35; color: #FFF0C0;"
          scale="1.4 1.4 1.4"
          position="0 0 0.05"
        ></a-entity>
        <!-- ★ 横と縦のサイズ(widthとheight)を入れ替えて、縦長(9:16)に設定 -->
        <a-video
          id="videoPlane02"
          src="#artist02"
          position="0 0 0.1"
          width="0.7875"
          height="1.4"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>

      <!-- TARGET 03 (横動画) -->
      <a-entity id="target03" mindar-image-target="targetIndex: 2">
        <a-entity
          safe-dust="count: 35; color: #FFF0C0;"
          scale="1.4 1.4 1.4"
          position="0 0 0.05"
        ></a-entity>
        <a-video
          id="videoPlane03"
          src="#artist03"
          position="0 0 0.1"
          width="1.4"
          height="0.7875"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>

      <!-- TARGET 04 (横動画) -->
      <a-entity id="target04" mindar-image-target="targetIndex: 3">
        <a-entity
          safe-dust="count: 35; color: #FFF0C0;"
          scale="1.4 1.4 1.4"
          position="0 0 0.05"
        ></a-entity>
        <a-video
          id="videoPlane04"
          src="#artist04"
          position="0 0 0.1"
          width="1.4"
          height="0.7875"
          visible="false"
          material="transparent: true; opacity: 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const CONFIG = {
        artist01: {
          captions: [
            { start: 0, end: 4, text: "" },
            {
              start: 4,
              end: 9,
              text: "これ描いてるとき、なんも考えてない。落ち着くから。",
            },
            { start: 9, end: 14, text: "好きな色から、順番に塗っていくの。" },
          ],
          messageDelay: 2.5,
          messageText: "誰かに、届きますように",
        },
        artist02: {
          captions: [
            { start: 0, end: 4, text: "" },
            { start: 4, end: 10, text: "" },
          ],
          messageDelay: 2.5,
          messageText: "誰かに、届きますように",
        },
        artist03: {
          captions: [
            { start: 0, end: 4, text: "" },
            { start: 4, end: 10, text: "" },
          ],
          messageDelay: 2.5,
          messageText: "誰かに、届きますように",
        },
        artist04: {
          captions: [
            { start: 0, end: 4, text: "" },
            { start: 4, end: 10, text: "" },
          ],
          messageDelay: 2.5,
          messageText: "誰かに、届きますように",
        },
      };

      const FADE_DUR = 400;

      const scene = document.getElementById("scene");
      const start = document.getElementById("start");
      const startButton = document.getElementById("startButton");
      const message = document.getElementById("message");
      const caption = document.getElementById("caption");
      const thanks = document.getElementById("thanks");
      const controls = document.getElementById("controls");
      const playPause = document.getElementById("playPause");
      const timeline = document.getElementById("timeline");
      const yokohamaLink = document.getElementById("yokohama-link"); // ★ 追加

      const arItems = [
        {
          key: "artist01",
          target: document.getElementById("target01"),
          video: document.getElementById("artist01"),
          plane: document.getElementById("videoPlane01"),
        },
        {
          key: "artist02",
          target: document.getElementById("target02"),
          video: document.getElementById("artist02"),
          plane: document.getElementById("videoPlane02"),
        },
        {
          key: "artist03",
          target: document.getElementById("target03"),
          video: document.getElementById("artist03"),
          plane: document.getElementById("videoPlane03"),
        },
        {
          key: "artist04",
          target: document.getElementById("target04"),
          video: document.getElementById("artist04"),
          plane: document.getElementById("videoPlane04"),
        },
      ];

      let currentKey = null;
      let messageTimer = null;
      let isSeeking = false;
      let typewriterTimer = null;

      const fadeTimers = new Map();
      const playPromises = new Map();

      function clearFadeTimer(plane) {
        const t = fadeTimers.get(plane);
        if (t) {
          clearTimeout(t);
          fadeTimers.delete(plane);
        }
      }

      function fadeInPlane(plane) {
        clearFadeTimer(plane);
        plane.removeAttribute("animation__fadeout");
        plane.setAttribute("visible", true);
        plane.setAttribute("animation__fadein", {
          property: "material.opacity",
          from: 0,
          to: 1,
          dur: FADE_DUR,
          easing: "easeInOutQuad",
        });
      }

      function fadeOutPlane(plane) {
        clearFadeTimer(plane);
        plane.removeAttribute("animation__fadein");
        plane.setAttribute("animation__fadeout", {
          property: "material.opacity",
          from: 1,
          to: 0,
          dur: FADE_DUR,
          easing: "easeInOutQuad",
        });
        const timerId = setTimeout(() => {
          plane.setAttribute("visible", false);
          fadeTimers.delete(plane);
        }, FADE_DUR);
        fadeTimers.set(plane, timerId);
      }

      function safePlay(video) {
        const p = video.play();
        if (p !== undefined) {
          playPromises.set(video, p);
          p.catch((e) => console.log("play error:", e)).finally(() =>
            playPromises.delete(video),
          );
        }
      }

      async function safePause(video) {
        const pending = playPromises.get(video);
        if (pending) {
          try {
            await pending;
          } catch (e) {}
        }
        video.pause();
      }

      function stopOtherVideos(keepKey) {
        arItems.forEach((item) => {
          if (item.key !== keepKey) {
            safePause(item.video);
            fadeOutPlane(item.plane);
          }
        });
      }

      startButton.addEventListener("click", async () => {
        startButton.disabled = true;
        startButton.textContent = "カメラを起動しています…";
        try {
          const arSystem = scene.systems["mindar-image-system"];
          if (!arSystem) throw new Error("MindAR systemが見つかりません");
          await arSystem.start();

          arItems.forEach((item) => item.video.load());

          start.style.display = "none";
          message.style.display = "block";
          yokohamaLink.style.display = "block"; // ★ 追加: カメラ起動後にリンクボタンを表示
        } catch (error) {
          console.error("AR START ERROR:", error);
          startButton.disabled = false;
          startButton.textContent = "カメラを起動する";
          alert(
            "システムエラーが発生しました。\nページを再読み込みしてもう一度お試しください。",
          );
        }
      });

      function showThanksTypewriter(key) {
        const conf = CONFIG[key];
        clearTimeout(messageTimer);
        clearInterval(typewriterTimer);
        thanks.classList.remove("show");
        thanks.textContent = "";
        messageTimer = setTimeout(() => {
          thanks.classList.add("show");
          const text = conf.messageText;
          let i = 0;
          typewriterTimer = setInterval(() => {
            thanks.textContent += text[i];
            i++;
            if (i >= text.length) clearInterval(typewriterTimer);
          }, 80);
        }, conf.messageDelay * 1000);
      }

      function hideThanks() {
        clearTimeout(messageTimer);
        clearInterval(typewriterTimer);
        thanks.classList.remove("show");
      }

      arItems.forEach((item) => {
        item.video.addEventListener("timeupdate", () => {
          if (currentKey !== item.key) return;
          const conf = CONFIG[item.key];
          const t = item.video.currentTime;
          const hit = conf.captions.find((c) => t >= c.start && t < c.end);

          if (hit && hit.text) {
            if (caption.textContent !== hit.text)
              caption.textContent = hit.text;
            caption.classList.add("show");
          } else {
            caption.classList.remove("show");
          }
          if (!isSeeking && item.video.duration) {
            timeline.value =
              (item.video.currentTime / item.video.duration) * 100;
          }
        });

        item.video.addEventListener("loadedmetadata", () => {
          if (currentKey === item.key) timeline.value = 0;
        });

        item.target.addEventListener("targetFound", () => {
          console.log(`TARGET ${item.key} FOUND`);
          currentKey = item.key;
          message.style.display = "none";

          stopOtherVideos(item.key);

          item.video.currentTime = 0;
          timeline.value = 0;
          playPause.textContent = "Ⅱ";

          fadeInPlane(item.plane);
          safePlay(item.video);

          controls.style.display = "flex";
          showThanksTypewriter(item.key);
        });

        item.target.addEventListener("targetLost", () => {
          console.log(`TARGET ${item.key} LOST`);
          fadeOutPlane(item.plane);
          safePause(item.video);
          caption.classList.remove("show");
          hideThanks();
          controls.style.display = "none";
          playPause.textContent = "▶";

          if (currentKey === item.key) {
            message.style.display = "block";
            message.textContent = "イラストにカメラを向けてください";
          }
        });

        item.video.addEventListener("ended", () => {
          if (currentKey !== item.key) return;
          playPause.textContent = "▶";
          caption.classList.remove("show");
          timeline.value = 100;
        });
      });

      playPause.addEventListener("click", () => {
        if (!currentKey) return;
        const currentItem = arItems.find((i) => i.key === currentKey);
        if (currentItem.video.paused) {
          safePlay(currentItem.video);
          playPause.textContent = "Ⅱ";
        } else {
          safePause(currentItem.video);
          playPause.textContent = "▶";
        }
      });

      timeline.addEventListener("pointerdown", () => (isSeeking = true));
      timeline.addEventListener("pointerup", () => (isSeeking = false));
      timeline.addEventListener("change", () => (isSeeking = false));
      timeline.addEventListener("input", () => {
        if (!currentKey) return;
        const currentItem = arItems.find((i) => i.key === currentKey);
        if (!currentItem.video.duration) return;
        const ratio = Number(timeline.value) / 100;
        currentItem.video.currentTime = currentItem.video.duration * ratio;
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          console.log("PAGE RESUMED — resetting AR video state");
          arItems.forEach((item) => {
            safePause(item.video);
            clearFadeTimer(item.plane);
            item.plane.removeAttribute("animation__fadein");
            item.plane.removeAttribute("animation__fadeout");
            item.plane.setAttribute("visible", false);
            item.plane.setAttribute("material", "opacity", 0);
            item.video.load();
          });

          caption.classList.remove("show");
          hideThanks();
          controls.style.display = "none";
          playPause.textContent = "▶";
          timeline.value = 0;
          currentKey = null;
          message.style.display = "block";
          message.textContent = "イラストにカメラを向けてください";
        }
      });
    </script>
  </body>
</html>
