<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Artist</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* 最初の画面 */
    #start {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: #111;
    }

    #start p {
      color: white;
      font-size: 15px;
      margin-bottom: 20px;
    }

    #start button {
      padding: 18px 32px;

      font-size: 18px;

      border: none;
      border-radius: 12px;

      background: white;
      color: black;
    }

    #start button:disabled {
      opacity: 0.6;
    }

    /* カメラ起動後の案内 */
    #message {
      position: fixed;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 500;

      color: white;

      background: rgba(0, 0, 0, 0.65);

      padding: 10px 18px;

      border-radius: 20px;

      font-size: 14px;

      display: none;

      white-space: nowrap;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>


<body>


  <!-- =========================
       最初の画面
  ========================== -->

  <div id="start">

    <p>
      カメラを使って作品を体験します
    </p>

    <button id="startButton">
      AR体験をはじめる
    </button>

  </div>


  <!-- =========================
       カメラ起動後の案内
  ========================== -->

  <div id="message">
    イラストにカメラを向けてください
  </div>


  <!-- =========================
       MindAR
  ========================== -->

  <a-scene

    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      maxTrack: 1;
      uiScanning: no;
      uiLoading: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- =========================
         動画
    ========================== -->

    <a-assets>

      <video
        id="artist01"
        src="./artist01.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>

      <video
        id="artist02"
        src="./artist02.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>

    </a-assets>


    <!-- =========================
         カメラ
    ========================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- =========================
         TARGET 01
    ========================== -->

    <a-entity
      id="target01"
      mindar-image-target="targetIndex: 0"
    >

      <a-video

        id="videoPlane01"

        src="#artist01"

        position="0 0 0"

        width="1"
        height="0.5625"

        visible="false"

      ></a-video>

    </a-entity>


    <!-- =========================
         TARGET 02
    ========================== -->

    <a-entity
      id="target02"
      mindar-image-target="targetIndex: 1"
    >

      <a-video

        id="videoPlane02"

        src="#artist02"

        position="0 0 0"

        width="1"
        height="0.5625"

        visible="false"

      ></a-video>

    </a-entity>


  </a-scene>


  <script>

    /*
     * =========================
     * 要素取得
     * =========================
     */

    const scene =
      document.getElementById("scene");

    const start =
      document.getElementById("start");

    const startButton =
      document.getElementById("startButton");

    const message =
      document.getElementById("message");


    const target01 =
      document.getElementById("target01");

    const target02 =
      document.getElementById("target02");


    const video01 =
      document.getElementById("artist01");

    const video02 =
      document.getElementById("artist02");


    const plane01 =
      document.getElementById("videoPlane01");

    const plane02 =
      document.getElementById("videoPlane02");


    /*
     * =========================
     * AR開始
     * =========================
     *
     * ここが重要。
     *
     * sceneがloadedになるのを待ったり、
     * arReadyを待ったりしない。
     *
     * ボタンを押した瞬間に
     * MindARを開始する。
     */

    startButton.addEventListener(
      "click",
      async () => {

        startButton.disabled = true;

        startButton.textContent =
          "カメラを起動しています…";


        try {

          const arSystem =
            scene.systems["mindar-image-system"];


          if (!arSystem) {

            throw new Error(
              "MindAR systemが見つかりません"
            );

          }


          /*
           * カメラ＋AR開始
           */

          await arSystem.start();


          /*
           * ここまで来たら
           * カメラ起動成功
           */

          start.style.display = "none";

          message.style.display = "block";

          message.textContent =
            "イラストにカメラを向けてください";


        } catch (error) {

          console.error(
            "AR START ERROR:",
            error
          );


          startButton.disabled = false;

          startButton.textContent =
            "AR体験をはじめる";


          alert(
            "カメラを起動できませんでした。\n" +
            "ブラウザのカメラ使用許可を確認してください。"
          );

        }

      }
    );


    /*
     * =========================
     * TARGET 01 FOUND
     * =========================
     */

    target01.addEventListener(
      "targetFound",
      () => {

        console.log(
          "TARGET 01 FOUND"
        );


        /*
         * 案内を消す
         */

        message.style.display =
          "none";


        /*
         * TARGET 02停止
         */

        video02.pause();

        plane02.setAttribute(
          "visible",
          false
        );


        /*
         * TARGET 01表示
         */

        plane01.setAttribute(
          "visible",
          true
        );


        /*
         * 最初から再生
         */

        video01.currentTime = 0;


        video01.play().catch(
          error => {

            console.log(
              "artist01 play error:",
              error
            );

          }
        );

      }
    );


    /*
     * =========================
     * TARGET 01 LOST
     * =========================
     */

    target01.addEventListener(
      "targetLost",
      () => {

        console.log(
          "TARGET 01 LOST"
        );


        plane01.setAttribute(
          "visible",
          false
        );


        video01.pause();


        message.style.display =
          "block";

        message.textContent =
          "イラストにカメラを向けてください";

      }
    );


    /*
     * =========================
     * TARGET 02 FOUND
     * =========================
     */

    target02.addEventListener(
      "targetFound",
      () => {

        console.log(
          "TARGET 02 FOUND"
        );


        /*
         * 案内を消す
         */

        message.style.display =
          "none";


        /*
         * TARGET 01停止
         */

        video01.pause();

        plane01.setAttribute(
          "visible",
          false
        );


        /*
         * TARGET 02表示
         */

        plane02.setAttribute(
          "visible",
          true
        );


        /*
         * 最初から再生
         */

        video02.currentTime = 0;


        video02.play().catch(
          error => {

            console.log(
              "artist02 play error:",
              error
            );

          }
        );

      }
    );


    /*
     * =========================
     * TARGET 02 LOST
     * =========================
     */

    target02.addEventListener(
      "targetLost",
      () => {

        console.log(
          "TARGET 02 LOST"
        );


        plane02.setAttribute(
          "visible",
          false
        );


        video02.pause();


        message.style.display =
          "block";

        message.textContent =
          "イラストにカメラを向けてください";

      }
    );

  </script>

</body>
</html>
